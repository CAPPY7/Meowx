name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install mpv ffmpeg dylibbundler create-dmg
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-manual" >> "$GITHUB_OUTPUT"
          fi
      - name: Unit tests
        run: swift test --package-path Packages/MeowxCore
      - name: Build
        run: >
          xcodebuild
          -project Meowx.xcodeproj
          -scheme Meowx
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build/DerivedData
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=NO
          MACOSX_DEPLOYMENT_TARGET=26.0
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_REQUIRED=YES
          clean build
      - name: Bundle libraries
        run: |
          APP="$(find build/DerivedData -name Meowx.app -type d | head -1)"
          test -n "$APP"
          scripts/bundle_libs.sh "$APP"
          mkdir -p build/dist
          rm -rf build/dist/Meowx.app
          cp -R "$APP" build/dist/Meowx.app
      - name: Verify bundle
        run: scripts/verify_bundle.sh build/dist/Meowx.app
      - name: Create DMG
        run: |
          ok=0
          for attempt in 1 2 3; do
            if scripts/build_dmg.sh build/dist/Meowx.app "${{ steps.version.outputs.value }}"; then
              ok=1
              break
            fi
            echo "create-dmg attempt ${attempt} failed"
            hdiutil detach /Volumes/Meowx >/dev/null 2>&1 || true
            sleep 2
          done
          test "$ok" = 1
          cp "build/Meowx-${{ steps.version.outputs.value }}.dmg" build/Meowx.dmg
          ( cd build && shasum -a 256 Meowx.dmg ) | tee build/Meowx.dmg.sha256
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Meowx-${{ steps.version.outputs.value }}.dmg
            build/Meowx-${{ steps.version.outputs.value }}.dmg.sha256
            build/Meowx.dmg
            build/Meowx.dmg.sha256
      - name: Upload manual build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Meowx-manual
          path: |
            build/Meowx-*.dmg
            build/Meowx-*.dmg.sha256
            build/Meowx.dmg
            build/Meowx.dmg.sha256
      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: scripts/update_tap.sh "$VERSION" "$(awk '{print $1}' "build/Meowx-${VERSION}.dmg.sha256")"
